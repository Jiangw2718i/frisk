name: Publish

# Publishes on a version tag. No registry tokens exist anywhere in this repo or
# its secrets: npm and PyPI both authenticate the run itself, via the OIDC token
# GitHub mints for this workflow file. That means there is no credential to leak
# and none to rotate, and every artifact carries a provenance attestation
# pointing back at the commit that built it.
#
# Each job is a no-op if that package's version is already on the registry, so a
# tag that bumps one package does not fail on the two it did not touch.
#
# Both registries must be told to trust this workflow before the first run:
#   npm   – npmjs.com > package > Settings > Trusted publisher > GitHub Actions
#   PyPI  – pypi.org > project > Publishing > Add a GitHub publisher
# In both cases the workflow filename is `publish.yml` and the repository is
# Jiangw2718i/frisk.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm exchanges for publish rights
    strategy:
      # frisk-mcp depends on frisk-screen from the registry, so a release that
      # bumps both has to put frisk-screen there first.
      max-parallel: 1
      matrix:
        dir: [typescript, mcp]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install --global npm@latest

      - id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "$name@$version"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already on the registry, nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.check.outputs.publish == 'true'
        run: pnpm typecheck

      - if: steps.check.outputs.publish == 'true'
        run: pnpm test

      # Built here explicitly: .npmrc sets ignore-scripts, which also silences
      # the prepublishOnly hook that used to do this.
      - if: steps.check.outputs.publish == 'true'
        run: pnpm build

      # No NODE_AUTH_TOKEN. npm sees the OIDC token and publishes with
      # provenance.
      - if: steps.check.outputs.publish == 'true'
        run: npm publish

  pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - id: check
        run: |
          version=$(uv version --short)
          echo "frisk-screen $version"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/frisk-screen/$version/json")
          if [ "$code" = "200" ]; then
            echo "already on PyPI, nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "PyPI answered $code, refusing to guess"
            exit 1
          fi

      - if: steps.check.outputs.publish == 'true'
        run: uv sync

      - if: steps.check.outputs.publish == 'true'
        run: uv run pytest -q

      - if: steps.check.outputs.publish == 'true'
        run: uv build

      # `always` rather than `automatic` so a misconfigured trusted publisher
      # fails the run instead of quietly falling back to looking for a token.
      - if: steps.check.outputs.publish == 'true'
        run: uv publish --trusted-publishing always
